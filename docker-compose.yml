services:
  chatgpt-mirror:
    image: "${MIRROR_IMAGE:-lisa666520/chatgpt-super-mirror:latest}"
    pull_policy: always
    ports:
      - "${PORT:-40005}:${PORT:-40005}"
    environment:
      HOST: "0.0.0.0"
      PORT: "${PORT:-40005}"
      GATEWAY_ADMIN_SECRET: "${GATEWAY_ADMIN_SECRET:?GATEWAY_ADMIN_SECRET must be set}"
      GATEWAY_ACCESS_PASSWORD: "${GATEWAY_ACCESS_PASSWORD:?GATEWAY_ACCESS_PASSWORD must be set}"
      COOKIE_SECURE: "${COOKIE_SECURE:-true}"
      CLOUDFLARE_TURNSTILE: "${CLOUDFLARE_TURNSTILE:-enable}"
      CLOUDFLARE_TURNSTILE_SITE_KEY: "${CLOUDFLARE_TURNSTILE_SITE_KEY:-}"
      CLOUDFLARE_TURNSTILE_SECRET_KEY: "${CLOUDFLARE_TURNSTILE_SECRET_KEY:-}"
      TURNSTILE_SESSION_TTL_SECONDS: "${TURNSTILE_SESSION_TTL_SECONDS:-86400}"
      CHATGPT_BASE_URL: "${CHATGPT_BASE_URL:-https://chatgpt.com}"
      CHATGPT_CDN_BASE_URL: "${CHATGPT_CDN_BASE_URL:-https://cdn.oaistatic.com}"
      CHATGPT_AB_BASE_URL: "${CHATGPT_AB_BASE_URL:-https://ab.chatgpt.com}"
      CF_BYPASS_PROXY_SERVER: "${CF_BYPASS_PROXY_SERVER:-}"
      CF_BYPASS_HEADLESS: "${CF_BYPASS_HEADLESS:-true}"
      CF_BYPASS_MAX_WAIT_SECONDS: "${CF_BYPASS_MAX_WAIT_SECONDS:-35}"
      CF_BYPASS_PARTIAL_COOKIE_GRACE_SECONDS: "${CF_BYPASS_PARTIAL_COOKIE_GRACE_SECONDS:-8}"
      CF_BYPASS_NAVIGATION_RETRIES: "${CF_BYPASS_NAVIGATION_RETRIES:-2}"
      CF_BYPASS_ALLOWED_HOSTS: "${CF_BYPASS_ALLOWED_HOSTS:-chatgpt.com,.chatgpt.com}"
      MIRROR_DEFAULT_PROXY_URL: "${MIRROR_DEFAULT_PROXY_URL:-}"
      MIRROR_PROXY_USERNAME: "${MIRROR_PROXY_USERNAME:-}"
      MIRROR_PROXY_PASSWORD: "${MIRROR_PROXY_PASSWORD:-}"
      REQUEST_TIMEOUT_SECS: "${REQUEST_TIMEOUT_SECS:-180}"
      RUST_LOG: "${RUST_LOG:-info}"
      TZ: "${TZ:-Asia/Shanghai}"
    shm_size: "1gb"
    restart: unless-stopped
